name: build-apk

# push 到 my-mod 且改了 app 相关文件时,云端编译 debug APK 并发布 Release

on:
  push:
    branches: [my-mod]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'gradlew', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          if ! ./gradlew :app:assembleDebug :cast:assembleDebug --no-daemon > build.log 2>&1; then
            tail -40 build.log
            gh release create "build-failed-${{ github.run_number }}" --repo "$GITHUB_REPOSITORY"               --title "BUILD FAILED #${{ github.run_number }}"               --notes "see build.log" build.log || true
            exit 1
          fi
          tail -5 build.log

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zsnavi-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk cast/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "专属导航 $TAG" \
            --notes "专属导航:删特斯拉/赞助与用户身份显示。专属投屏:独立投屏 app,屏幕→H.264→C3 carrot_navi(7714),对接开源 WS v2 协议。"
          echo "release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
